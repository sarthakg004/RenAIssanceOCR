<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">One interface, several engines</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#64748b">The application asks for a provider; the factory returns one. It never needs to know which engine is behind it.</text>

  <!-- Application node -->
  <rect x="48" y="210" width="190" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="143" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Application</text>
  <text x="143" y="282" text-anchor="middle" font-size="12.5" fill="#475569">The reading step</text>
  <text x="143" y="300" text-anchor="middle" font-size="12.5" fill="#475569">of the wizard</text>

  <!-- Factory node -->
  <rect x="370" y="196" width="220" height="148" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OCR Provider Factory</text>
  <line x1="398" y1="258" x2="562" y2="258" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="284" text-anchor="middle" font-size="12.5" fill="#475569">Every engine shares one</text>
  <text x="480" y="303" text-anchor="middle" font-size="12.5" fill="#475569">common interface</text>
  <text x="480" y="326" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">BaseOCRProvider</text>

  <!-- App <-> Factory arrows -->
  <path d="M238 254 L366 254" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="244" text-anchor="middle" font-size="11.5" fill="#64748b">asks for a provider</text>
  <path d="M366 292 L242 292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="302" y="312" text-anchor="middle" font-size="11.5" fill="#64748b">returns one</text>

  <!-- Engine nodes -->
  <!-- Gemini -->
  <rect x="712" y="96" width="200" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="812" y="128" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3730a3">Gemini</text>
  <text x="812" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">Cloud provider</text>

  <!-- ChatGPT -->
  <rect x="712" y="182" width="200" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="812" y="214" text-anchor="middle" font-size="15.5" font-weight="700" fill="#065f46">ChatGPT</text>
  <text x="812" y="234" text-anchor="middle" font-size="11.5" fill="#64748b">Cloud provider</text>

  <!-- Local models -->
  <rect x="712" y="268" width="200" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="812" y="296" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9a3412">Local models</text>
  <text x="812" y="316" text-anchor="middle" font-size="11.5" fill="#64748b">CRNN and TrOCR, on device</text>

  <!-- Registered but hidden -->
  <rect x="712" y="354" width="200" height="66" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="812" y="382" text-anchor="middle" font-size="14.5" font-weight="600" fill="#94a3b8">DeepSeek, Qwen</text>
  <text x="812" y="401" text-anchor="middle" font-size="11" fill="#94a3b8">Registered, hidden in the UI</text>

  <!-- Factory -> engines connectors -->
  <path d="M590 262 C 650 220, 660 131, 708 131" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowLight)"/>
  <path d="M590 268 C 660 250, 660 217, 708 217" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowLight)"/>
  <path d="M590 278 C 660 290, 660 303, 708 303" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowLight)"/>
  <path d="M590 300 C 655 350, 660 387, 708 387" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowLight)"/>

  <!-- Footnote -->
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">Adding a new engine means writing one module and registering it. Nothing else in the application changes.</text>
</svg>
